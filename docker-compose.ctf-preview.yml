# Isolated local preview of CTF inputs, Pwn/RE execution, evidence and write-ups.
# Start with: docker compose --env-file data/ctf-preview.env -p p3y-preview -f docker-compose.ctf-preview.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: p3y_preview
      POSTGRES_PASSWORD: ${P3Y_PREVIEW_DB_PASSWORD:?请创建 data/ctf-preview.env}
      POSTGRES_DB: p3y_preview
    volumes:
      - preview_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p3y_preview -d p3y_preview"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  p3y:
    image: p3y/p3y:v0.92
    depends_on:
      postgres:
        condition: service_healthy
      p3y-box:
        condition: service_healthy
    environment:
      P3Y_PG_DSN: postgres://p3y_preview:${P3Y_PREVIEW_DB_PASSWORD}@postgres:5432/p3y_preview?sslmode=disable
      P3Y_BOX_URL: http://p3y-box:8790
      P3Y_BOX_TOKEN: ${P3Y_BOX_TOKEN:?请在 data/ctf-preview.env 设置执行器令牌}
      P3Y_CTF_FLAG_PREFIXES: ${P3Y_CTF_FLAG_PREFIXES:-}
    ports:
      - "127.0.0.1:8789:8787"
    volumes:
      - preview_data:/app/data
      - preview_skills:/app/skills
    restart: unless-stopped

  p3y-box:
    image: p3y/p3y-box:0.9.0
    environment:
      P3Y_BOX_TOKEN: ${P3Y_BOX_TOKEN:?请在 data/ctf-preview.env 设置执行器令牌}
      P3Y_BOX_TOOL_IMAGE: p3y/p3y-box-tools:20261113
      P3Y_VPN_WG_IMAGE: p3y/p3y-box-wg:0.9.0
      P3Y_VPN_NETWORK: p3y-box-vpn
      P3Y_VPN_SUBNET: 10.220.0.0/16
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - preview_runner_state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8790/health',headers={'Authorization':'Bearer '+os.environ['P3Y_BOX_TOKEN']}); urllib.request.urlopen(r,timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  preview_pgdata:
  preview_data:
  preview_skills:
  preview_runner_state:
